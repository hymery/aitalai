services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bashkir_school
      POSTGRES_USER: bashkir
      POSTGRES_PASSWORD: bashkir
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bashkir -d bashkir_school"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg2://bashkir:bashkir@db:5432/bashkir_school
    command: sh -c "python seed.py && uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file: ./bot/.env
    environment:
      API_URL: http://backend:8000
      WEBAPP_DIR: /app/frontend
      USERS_FILE: data/users.json
    volumes:
      - bot-data:/app/bot/data
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  bot-data:
