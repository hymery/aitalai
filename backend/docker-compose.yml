services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bashkir_school}
      POSTGRES_USER: ${POSTGRES_USER:-bashkir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bashkir}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-bashkir}:${POSTGRES_PASSWORD:-bashkir}@db:5432/${POSTGRES_DB:-bashkir_school}
    ports:
      - "8000:8000"

volumes:
  postgres_data:
