<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!-- Простой ромб -->
  <symbol id="rhombus" viewBox="0 0 32 32">
    <path d="M16 2 30 16 16 30 2 16Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/>
    <path d="M16 9 23 16 16 23 9 16Z" fill="currentColor"/>
  </symbol>

  <!-- Ромб со ступенями -->
  <symbol id="rhombus-stepped" viewBox="0 0 32 32">
    <path d="M16 1 21 6h5v5l5 5-5 5v5h-5l-5 5-5-5H6v-5l-5-5 5-5V6h5Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
  </symbol>

  <!-- Ҡуңыр: две симметричные завитушки-спирали -->
  <symbol id="ram-horns" viewBox="0 0 64 40">
    <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 34C29 24 24 15 15 13 8 11.5 2 16 2 22c0 5 4 8 8.5 8 4 0 6.5-3 6.5-6.5 0-3-2.5-5-5.5-5-2.5 0-4 1.5-4 3.5"/>
      <path d="M34 34c1-10 6-19 15-21 7-1.5 13 3 13 9 0 5-4 8-8.5 8-4 0-6.5-3-6.5-6.5 0-3 2.5-5 5.5-5 2.5 0 4 1.5 4 3.5"/>
    </g>
  </symbol>

  <!-- Курай-гөл: восемь лепестков -->
  <symbol id="kurai" viewBox="0 0 32 32">
    <g fill="currentColor">
      <path d="M16 13 20.5 6.5 16 1 11.5 6.5Z"/>
      <path d="M16 13 20.5 6.5 16 1 11.5 6.5Z" transform="rotate(45 16 16)"/>
      <path d="M16 13 20.5 6.5 16 1 11.5 6.5Z" transform="rotate(90 16 16)"/>
      <path d="M16 13 20.5 6.5 16 1 11.5 6.5Z" transform="rotate(135 16 16)"/>
      <path d="M16 13 20.5 6.5 16 1 11.5 6.5Z" transform="rotate(180 16 16)"/>
      <path d="M16 13 20.5 6.5 16 1 11.5 6.5Z" transform="rotate(225 16 16)"/>
      <path d="M16 13 20.5 6.5 16 1 11.5 6.5Z" transform="rotate(270 16 16)"/>
      <path d="M16 13 20.5 6.5 16 1 11.5 6.5Z" transform="rotate(315 16 16)"/>
      <circle cx="16" cy="16" r="2.8"/>
    </g>
  </symbol>

  <!-- Рамка значка: ромб со ступенчатым орнаментальным краем -->
  <symbol id="badge-frame" viewBox="0 0 80 80">
    <path d="M40 1 51 12H64V25L79 40 64 55V68H51L40 79 29 68H16V55L1 40 16 25V12H29Z M40 13 50 23H57V30L67 40 57 50V57H50L40 67 30 57H23V50L13 40 23 30V23H30Z M40 14 43 17 40 20 37 17Z M40 60 43 63 40 66 37 63Z M17 40 20 37 23 40 20 43Z M57 40 60 37 63 40 60 43Z" fill="currentColor" fill-rule="evenodd"/>
